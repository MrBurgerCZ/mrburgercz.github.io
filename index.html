<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrBurgerCZ</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1 class="mt-5 mb-4">MrBurgerCZ</h1>
    <div class="list-group">
      <a href="http://map.mrburgercz.site" class="list-group-item list-group-item-action">Dynmapa</a>
      <a href="#" class="list-group-item list-group-item-action" onclick="copyToClipboard('mc.mrburgercz.site')">Minecraft Server - mc.mrburgercz.site</a>
      <a href="#" class="list-group-item list-group-item-action" onclick="copyToClipboard('play.mrburgercz.site')">Minecraft Server - play.mrburgercz.site</a>
    </div>
  </div>
  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JavaScript -->
  <script>
    function copyToClipboard(text) {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      alert('Hostname serveru byl zkopírován do schránky.');
    }
  </script>
</body>
</html>
