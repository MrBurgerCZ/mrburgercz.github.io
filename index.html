<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>MrBurgerCZ</title>
</head>

<script type="module" src="./click-spark.js"></script>

<body>
  <click-spark></click-spark>
  <div class="main-dialog">
    <h1>MrBurgerCZ</h1>
    <p class="small">(to jsem já)</p>
    <ul class="main-dialog__options">
      <li>
        <a href="http://map.mrburger.cz" class="list-group-item list-group-item-action">Dynmapa</a>
      </li>
      <li><a href="javascript:void(0);" class="list-group-item list-group-item-action"
          onclick="copyToClipboard('mc.mrburger.cz')">Minecraft Server - mc.mrburger.cz</a>
      </li>
      <li>
        <a href="javascript:void(0);" class="list-group-item list-group-item-action"
          onclick="copyToClipboard('play.mrburger.cz')">Minecraft Server - play.mrburger.cz</a>
      </li>

    </ul>
    <p></p>
    <h2>Pravděpodobně se nebudete moct připojit k serveru, nemám správně nastavené DNS záznamy a router.</h2>
    <p>Modpack <a class="link" href="https://github.com/MrBurgerCZ/waxedlightlyweathercutcopperstairs-modpack">zde</a>.</p> 
  </div>
  <script>
    function copyToClipboard(text) {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      alert('Zkopírováno do schránky.');
    }
  </script>
  <footer>
    <div class="footer-text">
      <p>made by <a href="https://github.com/MrBurgerCZ">MrBurgerCZ</a> • using <a
          href="https://github.com/catppuccin">Catppuccin</a> colors</p>
    </div>
  </footer>
</body>

</html>
