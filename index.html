<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrBurgerCZ</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Minecraft-like font -->
  <style>
    @font-face {
      font-family: 'Minecraft';
      src:	url("https://db.onlinewebfonts.com/t/6ab539c6fc2b21ff0b149b3d06d7f97c.woff2")format("woff2"),
    		url("https://db.onlinewebfonts.com/t/6ab539c6fc2b21ff0b149b3d06d7f97c.woff")format("woff"),
      font-weight: normal;
      font-style: normal;
    }

    .minecraft-font {
      font-family: 'Minecraft', sans-serif;
    }

    body {
      background-color: #121212;
      color: #FFFFFF;
    }

    .list-group-item {
      background-color: #333333;
      border-color: #333333;
      color: #FFFFFF;
    }

    .list-group-item:hover {
      background-color: #444444;
    }

    .list-group-item-action.active {
      background-color: #555555;
      border-color: #555555;
    }

    .container {
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mt-5 mb-4">MrBurgerCZ</h1>
    <div class="list-group">
      <a href="http://map.mrburger.cz" class="list-group-item list-group-item-action">Dynmapa</a>
      <a href="javascript:void(0);" class="list-group-item list-group-item-action" onclick="copyToClipboard('mc.mrburger.cz')">Minecraft Server - mc.mrburger.cz</a>
      <a href="javascript:void(0);" class="list-group-item list-group-item-action" onclick="copyToClipboard('play.mrburger.cz')">Minecraft Server - play.mrburger.cz</a>
    </div>

    <hr>
    <h1>!!! Server aktuálně neběží, to že nic nefunguje je v pořádku !!!</h1>
    Modpack <a href="https://github.com/MrBurgerCZ/waxedlightlyweathercutcopperstairs-modpack">zde</a>.
  </div>
  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JavaScript -->
  <script>
    function copyToClipboard(text) {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      alert('Hostname serveru byl zkopírován do schránky.');
    }
  </script>
