<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status</title>
</head>
<body>

<div id="function-description">
    <h2>Status</h2>
    <p>Zde se zobrazí stav vybrané funkce.</p>
</div>

<script>
    // Function to load function description based on URL parameter
    function loadFunctionDescription() {
        var urlParams = new URLSearchParams(window.location.search);
        var selectedFunction = urlParams.get('function');
        
        if (selectedFunction) {
            var functionDescriptions = {
                "Funkce1": "Toto je text popisující stav funkce 1.",
                "Funkce2": "Toto je text popisující stav funkce 2.",
                "Funkce3": "Toto je text popisující stav funkce 3."
                // Add more function descriptions as needed
            };

            var functionDescription = functionDescriptions[selectedFunction];
            if (functionDescription) {
                document.getElementById("function-description").innerHTML = "<h2>" + selectedFunction + "</h2><p>" + functionDescription + "</p>";
            }
        }
    }

    // Load function description when page loads
    window.onload = loadFunctionDescription;
</script>

</body>
</html>
